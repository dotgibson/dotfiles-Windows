name: nvim-sync

# Keep nvim/ in step with dotgibson/dotfiles-nvim. Windows vendors no core/ subtree —
# the only shared asset the host can use is the Neovim Lua tree, normally refreshed by
# hand with nvim-sync.ps1. This bot runs that sync weekly and opens a PR when the
# vendored copy has ACTUALLY fallen behind, so the editor config can't silently rot.
# workflow_dispatch syncs on demand.
#
# IT SYNCS FROM THE EDITOR REPO, NOT FROM CORE (dotfiles-core#1124). dotfiles-core's
# NVIM-SPLIT-PROPOSAL.md extracted nvim/ into its own repo with its own gate and its own
# release line; Core vendors it behind an nvim.lock and so does this repo. A bare
# nvim-sync.ps1 run now pins the newest vX.Y.Z RELEASE rather than a branch tip, so what
# this bot proposes is an editor release, not whatever landed upstream on Tuesday.
#
# AUTH — why this mints a GitHub App token instead of just using GITHUB_TOKEN. GitHub
# deliberately starts NO workflow run from an event created by the default GITHUB_TOKEN
# (its recursion guard), so a PR opened with it never fires ci.yml's `pull_request`
# trigger, never collects the required contexts, and sits BLOCKED until a human closes
# and reopens it — a manual step this bot was paying every week (#265). Pushing and
# opening the PR with a short-lived, repo-scoped token minted from the fleet App (the
# FLEET_APP_CLIENT_ID variable + FLEET_APP_PRIVATE_KEY secret, dotfiles-core's
# GITHUB-APP-AUTH.md) makes the PR App-authored, and its CI then runs unattended. Same
# problem, same fix, as dotfiles-core's freshness.yml. It DEGRADES rather than fails:
# with no App token the bot falls back to GITHUB_TOKEN, so the PR still opens — it just
# needs the manual nudge again. That degraded run is now LOUD (#269): an empty token,
# whether the mint was SKIPPED (no App configured here) or ATTEMPTED AND FAILED (the
# install pulled — continue-on-error swallowed the 404 and the job still went green, run
# 35223874896), raises a ::warning:: and a step-summary note naming the consequence, so a
# degraded run can no longer read as a clean one.

on:
  schedule:
    - cron: "0 8 * * 2" # Tuesdays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ref-independent: the bot always force-updates ONE fixed branch, so runs must
  # never overlap regardless of which ref launched them.
  group: nvim-sync
  cancel-in-progress: true

jobs:
  sync:
    # Fork guard (G9): the scheduled mirror runs only on the canonical repo — a fork has
    # nothing to sync and shouldn't attempt the branch push.
    if: github.repository_owner == 'dotgibson'
    runs-on: windows-latest # nvim-sync.ps1 uses robocopy /MIR — Windows-only
    timeout-minutes: 15
    permissions:
      contents: write # push the sync branch
      pull-requests: write # open/update the PR
    env:
      BRANCH: automation/nvim-sync
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Presence flag for the App private key (value 'true'/'false', never the key):
      # secrets cannot be tested in a step `if:`, but an env derived from a secret
      # comparison can. Same idiom, same reason, as notify-web.yml's.
      HAS_APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY != '' }}
    steps:
      # Mint a token scoped to THIS repo so the PR is opened as the App bot rather than
      # GITHUB_TOKEN — the one thing that lets its CI run without a human close+reopen.
      # continue-on-error: a repo without the App (a fork, or the install pulled) falls
      # back to GITHUB_TOKEN below; the PR still opens, it just stays BLOCKED as before —
      # and the step after this one says so out loud instead of letting it pass as green.
      - name: Mint a scoped installation token (if the App is installed here)
        id: app
        if: vars.FLEET_APP_CLIENT_ID != '' && env.HAS_APP_KEY == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id rather than app-id, which is deprecated at this pin (dotfiles-core
          # #831). The variable holds the App's Client ID — not its App ID.
          client-id: ${{ vars.FLEET_APP_CLIENT_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          # Neither `owner:` nor `repositories:` is set, which already scopes the token to
          # THIS repository; these two bound the VERBS on it. Deliberately NOT
          # `workflows: write` — this bot never touches .github/workflows/, and if that
          # ever changes the push fails loudly rather than the token having quietly been
          # able to rewrite CI all along.
          permission-contents: write
          permission-pull-requests: write
      # #268 stopped one step short of this. `continue-on-error` on the mint above means a
      # mint that FAILS — the App installation pulled, so create-github-app-token 404s on
      # /installation — is indistinguishable from one that was never attempted: both leave
      # the output empty, `|| github.token` quietly takes over, and the run still concludes
      # SUCCESS. That is the #265 failure re-entering through its own fallback, and it did:
      # theme-sync run 35223874896 opened a PR that sat BLOCKED, and a DIFFERENT repo's
      # weekly sweep caught it a day later — this repo's own green run said nothing. So say
      # it out loud. Gate on the TOKEN, not on steps.app.outcome: the token is empty in BOTH
      # branches, where `outcome == 'failure'` would miss the skip and `conclusion` is
      # `success` in both. Still a warning and not an `exit 1`, deliberately — a fork must
      # not go red, and a real drift from Core is worth landing behind a manual nudge rather
      # than not landing at all (#269).
      - name: Warn if no App token was minted (the PR will open BLOCKED)
        if: steps.app.outputs.token == ''
        # Explicit because this block is identical in all three sync bots and nvim-sync runs
        # on windows-latest, where the default shell is pwsh, not bash.
        shell: bash
        env:
          # Through `env:`, not spliced into the body — the house rule for every context
          # value a run block reads. `skipped` = no FLEET_APP_CLIENT_ID variable or
          # FLEET_APP_PRIVATE_KEY secret reached this run; `failure` = the mint WAS attempted
          # and returned no token. Only `outcome` separates them: `conclusion` is `success`
          # in both, which is the useless signal.
          MINT: ${{ steps.app.outcome }}
        run: |
          set -euo pipefail
          # One line: an annotation does not wrap, and a newline inside one needs %0A.
          echo "::warning::The fleet App token was not minted (mint step: ${MINT:-unknown}), so any PR this run opens is opened by GITHUB_TOKEN. GitHub's recursion guard means ci.yml will not fire on it, no required context will arrive, and the PR will sit BLOCKED until someone closes and reopens it (#265). Check that dotgibson-fleet-sync is still installed on this repo (dotfiles-core's GITHUB-APP-AUTH.md)."
          {
            echo "### ⚠️ No fleet App token — any PR this run opens will sit BLOCKED"
            echo
            echo "The mint step was \`${MINT:-unknown}\`, so the branch is pushed and the PR"
            echo "opened with \`GITHUB_TOKEN\`. GitHub starts **no** workflow run from an event"
            echo "that token created, so \`ci.yml\` never fires on the PR, not one of the"
            echo "contexts the \`main\` ruleset requires ever arrives, and it stays \`BLOCKED\`"
            echo "until a human closes and reopens it (#265)."
            echo
            echo "\`skipped\` means no \`FLEET_APP_CLIENT_ID\` variable or"
            echo "\`FLEET_APP_PRIVATE_KEY\` secret reached this run; \`failure\` means the mint"
            echo "was attempted and returned nothing. This job only runs on the canonical repo,"
            echo "so either way it is actionable here: check that \`dotgibson-fleet-sync\` is"
            echo "still installed on this repo, and that the variable and the secret still"
            echo "exist (dotfiles-core's \`GITHUB-APP-AUTH.md\`)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # the bot pushes its branch before opening the PR
          token: ${{ steps.app.outputs.token || github.token }}
      - name: Sync nvim/ from dotfiles-nvim
        shell: pwsh
        run: ./nvim-sync.ps1
      - name: Open a PR if nvim/ drifted
        shell: bash
        env:
          # Step scope, not job scope: a job-level `env:` cannot read the `steps`
          # context, so this is the only place the minted token resolves.
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          # nvim.lock carries a per-run `synced` timestamp, so judge drift on the Lua
          # tree only. Use status --porcelain (NOT diff --quiet) so a NEW file upstream
          # added under nvim/ — untracked after the copy — still counts as drift. The
          # pathspec needs no exclusion any more: since dotfiles-core#1124 the pin lives
          # at the repo ROOT, outside the tree being judged.
          changed="$(git status --porcelain -- nvim)"
          if [ -z "$changed" ]; then
            git checkout -- nvim.lock 2>/dev/null || true
            echo "✅ nvim/ already in step with dotfiles-nvim" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          # BOTH paths in ONE commit: a window where the tree moved and the pin did
          # not reads as drift to the parity gate and is indistinguishable from a
          # hand-edit. Same rule dotfiles-core's sync-nvim.sh states for its own lock.
          git add nvim nvim.lock
          git commit -m "chore(nvim): sync nvim/ from dotfiles-nvim (nvim-sync bot)"
          git push -f -u origin "$BRANCH"
          # Idempotent: update the existing PR if one is already open for this branch.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base "$DEFAULT_BRANCH" \
              --title "chore(nvim): sync nvim/ from dotfiles-nvim" \
              --body "Automated by the nvim-sync bot. \`dotgibson/dotfiles-nvim\` published an editor release ahead of the vendored copy here; this re-runs \`nvim-sync.ps1\`. Review the diff, let CI run, then merge."
          fi
          echo "🧩 opened/updated PR on \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
